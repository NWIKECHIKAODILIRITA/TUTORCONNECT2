<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
    <script src="../assets/js/utils.js" defer></script>
    <script src="../assets/js/validation.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a href="../index.html" aria-label="Back to landing page">Back</a>
      </header>

      <section aria-labelledby="signup-title">
        <h1 id="signup-title">Create your account</h1>

        <form action="#" method="post" data-validation-form>
          <fieldset>
            <legend>Role selection</legend>

            <div class="form-field">
              <label>
                <input type="radio" name="role" value="parent" required />
                Parent
              </label>
            </div>

            <div class="form-field">
              <label>
                <input type="radio" name="role" value="tutor" />
                Tutor
              </label>
            </div>

            <p class="field-error" id="role-error"></p>
          </fieldset>

          <div class="form-field">
            <label for="full-name">Full name</label>
            <input id="full-name" name="full_name" type="text" required />
            <p class="field-error" id="full-name-error"></p>
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
            <p class="field-error" id="email-error"></p>
          </div>

          <div class="form-field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" required />
            <p class="field-error" id="phone-error"></p>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
            <p class="field-error" id="password-error"></p>
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirm_password" type="password" required />
            <p class="field-error" id="confirm-password-error"></p>
          </div>

          <div>
            <button type="submit" class="btn btn-primary">Create account</button>
          </div>

          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>

        <nav aria-label="Role entry links" class="action-row">
          <p><a href="search-tutors.html" class="btn">Continue as Parent</a></p>
          <p><a href="tutor/my-profile.html" class="btn">Continue as Tutor</a></p>
        </nav>

        <p>
          Already have an account?
          <a href="log-in.html">Login</a>
        </p>
      </section>
    </main>
  </body>
</html>
