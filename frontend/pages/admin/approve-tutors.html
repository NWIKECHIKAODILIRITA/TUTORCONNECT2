<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Approve Tutors</title>
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <script src="../../assets/js/utils.js" defer></script>
    <script src="../../assets/js/admin.js" defer></script>
  </head>
  <body>
    <main class="admin-page">
      <header>
        <h1>Admin Panel</h1>
      </header>

      <section aria-labelledby="review-title">
        <h2 id="review-title">Tutor Review Queue</h2>
        <p id="admin-status" aria-live="polite"></p>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Subjects</th>
                <th>Experience</th>
                <th>Location</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr data-row-status>
                <td>Ada Adebayo</td>
                <td>Maths, Physics</td>
                <td>4 years</td>
                <td>Lagos</td>
                <td class="action-row">
                  <a href="approve-tutors.html" class="btn">View profile</a>
                  <a href="approve-tutors.html" class="btn btn-primary" data-action="approve">Approve</a>
                  <a href="approve-tutors.html" class="btn btn-danger" data-action="reject">Reject</a>
                </td>
              </tr>
              <tr data-row-status>
                <td>Daniel Okafor</td>
                <td>Chemistry</td>
                <td>2 years</td>
                <td>Abuja</td>
                <td class="action-row">
                  <a href="approve-tutors.html" class="btn">View profile</a>
                  <a href="approve-tutors.html" class="btn btn-primary" data-action="approve">Approve</a>
                  <a href="approve-tutors.html" class="btn btn-danger" data-action="reject">Reject</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <nav aria-label="Admin navigation" class="action-row">
        <a href="../log-in.html" class="btn">Back to log in</a>
        <a href="users.html" class="btn">Users</a>
        <a href="booking-requests.html" class="btn">Booking Requests</a>
      </nav>
    </main>
  </body>
</html>
