<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Tutors</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
    <script src="../assets/js/utils.js" defer></script>
    <script src="../assets/js/validation.js" defer></script>
    <script src="../assets/js/search.js" defer></script>
  </head>
  <body>
    <main class="search-page">
      <header class="site-header">
        <button type="button" aria-label="Open menu">Menu / Profile</button>
      </header>

      <section aria-labelledby="search-title">
        <h1 id="search-title">Find a tutor</h1>

        <form action="#" method="get" data-validation-form data-search-form>
          <div class="form-field">
            <label for="subject">Search subject</label>
            <input
              id="subject"
              name="subject"
              type="text"
              value="Maths, English, Biology..."
              aria-label="Search subject"
            />
            <p class="field-error" id="subject-error"></p>
          </div>

          <fieldset>
            <legend>Filters</legend>

            <div class="form-field">
              <label for="location">Location</label>
              <select id="location" name="location">
                <option value="">Select location</option>
                <option>Any</option>
                <option>Lagos</option>
                <option>Abuja</option>
              </select>
              <p class="field-error" id="location-error"></p>
            </div>

            <div class="form-field">
              <label for="time">Time</label>
              <select id="time" name="time">
                <option>Morning</option>
                <option>Evening</option>
              </select>
            </div>

            <div class="form-field">
              <label for="budget">Budget</label>
              <select id="budget" name="budget">
                <option>Any</option>
                <option>2k-5k</option>
                <option>5k+</option>
              </select>
            </div>

            <div class="form-field">
              <label for="experience">Experience</label>
              <select id="experience" name="experience">
                <option>Beginner</option>
                <option>Expert</option>
              </select>
            </div>
          </fieldset>

          <button type="submit" class="btn btn-primary">Search</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section aria-labelledby="results-title">
        <h2 id="results-title">Result list</h2>
        <div id="results-list" aria-live="polite"></div>
      </section>

      <nav aria-label="My requests navigation" class="action-row">
        <a href="my-session-requests.html" class="btn">My Requests</a>
      </nav>
    </main>
  </body>
</html>
